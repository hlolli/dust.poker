# A Midnight network on this machine, the "undeployed" one: a node with the dev preset (four
# genesis wallets, seeds 00..01 to 00..04, hold the Night) and a proof server, both from Docker
# Hub, alongside the released Ledger 9 indexer. All three services keep their development
# state in their containers; compose down removes that state together.
#
#   docker compose -f local/compose.yml up -d
#   bun local/fund.ts <mn_addr_undeployed1...>        # Night for a wallet, from the genesis one
#   docker compose -f local/compose.yml down          # a fresh chain next time
#
# Lace: Settings > Midnight > network "Undeployed" (node http://localhost:9944, indexer
# http://localhost:8088/api/v4/graphql, proof server http://localhost:6300), then fund the
# address it shows under Receive.
services:
  node:
    image: midnightntwrk/midnight-node:2.1.101
    container_name: dust-node
    ports:
      - "127.0.0.1:9944:9944"
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  proof-server:
    image: midnightntwrk/proof-server:9.0.0
    container_name: dust-proof-server
    command: ["midnight-proof-server"]
    ports:
      - "127.0.0.1:6300:6300"
    environment:
      RUST_BACKTRACE: full

  indexer:
    image: midnightntwrk/indexer-standalone:4.4.101
    container_name: dust-indexer
    depends_on:
      node:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__RECONNECT_MAX_DELAY: 24h
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: dummy-not-using-spo
      # Public development value, shared only by this disposable test chain.
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
