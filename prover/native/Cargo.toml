# Native build of Midnight's prover, for calibration against the wasm one: same crates,
# same keys, same preimage, run as a process on the player's machine. Built by
# scripts/build-prover-native.sh; the output is not committed.
[package]
name = "dust-poker-prove"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
zkir = { git = "https://github.com/midnightntwrk/midnight-zkir", package = "midnight-zkir" }
transient-crypto = { version = "3.0.0", package = "midnight-transient-crypto" }
serialize = { version = "1.0.0", package = "midnight-serialize" }
rand = "0.8"
futures-executor = "0.3"
rayon = "1"

# Same unpublished crates as prover/Cargo.toml; keep the rev in step with midnight-zkir.
[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }

[profile.release]
opt-level = 3
