name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run compact:build
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-deal
          path: |
            contracts/build/deal/contract
            contracts/build/deal/zkir
          retention-days: 7
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
