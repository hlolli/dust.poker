# The proof gate: every circuit of the referee proves with Midnight's wasm prover, on the
# real keys. Shuffle proofs take minutes on a runner, so it guards master rather than every
# pull request; ci.yml is the
# fast check. Run by hand with workflow_dispatch.
name: prove
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # The released wasm prover comes from bun.lock; Compact carries its matching key generator.
      - uses: actions/cache@v4
        with:
          path: .compact/prover/params
          key: midnight-kzg-params-v1
      - run: bun run compact:build --zk
      # Deployment, deposits and withdrawal applied with real proofs and signatures.
      # ci.yml skips this test because it does not generate keys.
      - run: bun test src/live/ledger.test.ts contracts/queue.test.ts
      - run: bun run prove:deal
